name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.js'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src
          sparse-checkout-cone-mode: false

      - name: Cache web-ext npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: web-ext-${{ runner.os }}-8.4.0
          restore-keys: web-ext-${{ runner.os }}-

      - name: Install web-ext
        run: npm install -g web-ext@8.4.0

      - name: Run web-ext lint
        uses: kewisch/action-web-ext@v2
        with:
          cmd: lint
          source: src
          channel: listed

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
