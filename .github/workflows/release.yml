name: Release & Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        uses: kewisch/action-web-ext@v1
        with:
          cmd: lint
          source: src
          channel: listed

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Patch versions and commit
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          echo "Target version: $VERSION"
          
          for FILE in "src/manifest.json" "package.json"; do
            if [ -f "$FILE" ]; then
              CURRENT_VERSION=$(jq -r .version "$FILE")
              if [ "$CURRENT_VERSION" != "$VERSION" ]; then
                echo "Updating $FILE from $CURRENT_VERSION to $VERSION"
                jq --arg v "$VERSION" '.version = $v' "$FILE" > tmp.json && mv tmp.json "$FILE"
              else
                echo "$FILE already has version $VERSION, skipping update."
              fi
            fi
          done
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/manifest.json package.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push origin HEAD:main
          else
            echo "No version changes to commit."
          fi

      - name: Build
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: src
          filename: "{name}-{version}.xpi"

      - name: Sign & publish to AMO
        id: web-ext-sign
        uses: kewisch/action-web-ext@v1
        continue-on-error: true
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          channel: listed
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          metaDataFile: .github/amo-metadata.json

      - name: Create GitHub Release and attach xpi
        env:
          GH_TOKEN: ${{ github.token }}
          XPI_PATH: ${{ steps.web-ext-build.outputs.target }}
          SIGNED_XPI_PATH: ${{ steps.web-ext-sign.outputs.target }}
        run: |
          cp "$XPI_PATH" "Hatsune.xpi"
          ASSETS=("Hatsune.xpi")
          
          if [[ -n "$SIGNED_XPI_PATH" && -f "$SIGNED_XPI_PATH" ]]; then
            cp "$SIGNED_XPI_PATH" "Hatsune.signed.xpi"
            ASSETS+=("Hatsune.signed.xpi")
          else
            SIGNED_FALLBACK=$(find web-ext-artifacts -maxdepth 1 -name "*.xpi" ! -name "$(basename "$XPI_PATH")" 2>/dev/null | head -n 1 || true)
            if [[ -n "$SIGNED_FALLBACK" && -f "$SIGNED_FALLBACK" ]]; then
              cp "$SIGNED_FALLBACK" "Hatsune.signed.xpi"
              ASSETS+=("Hatsune.signed.xpi")
            fi
          fi
          
          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
