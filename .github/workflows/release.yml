name: Release & Publish Extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache web-ext npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: web-ext-${{ runner.os }}-8.4.0

      - name: Install web-ext
        run: npm install -g web-ext@8.4.0

      - name: Lint
        uses: kewisch/action-web-ext@v1
        with:
          cmd: lint
          source: src
          channel: listed

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache web-ext npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: web-ext-${{ runner.os }}-8.4.0

      - name: Install web-ext
        run: npm install -g web-ext@8.4.0

      - name: Patch version in manifest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src/manifest.json > tmp.json
          mv tmp.json src/manifest.json

      - name: Build
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: src
          filename: "{name}-{version}.xpi"

      - name: Sign & publish to AMO
        id: web-ext-sign
        uses: kewisch/action-web-ext@v1
        continue-on-error: true
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          channel: listed
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          metaDataFile: amo-metadata.json

      - name: Create GitHub Release and attach xpi
        env:
          GH_TOKEN: ${{ github.token }}
          XPI_PATH: ${{ steps.web-ext-build.outputs.target }}
          SIGNED_XPI_PATH: ${{ steps.web-ext-sign.outputs.target }}
        run: |
          cp "$XPI_PATH" "Hatsune.xpi"
          ASSETS=("Hatsune.xpi")
          
          if [[ -n "$SIGNED_XPI_PATH" && -f "$SIGNED_XPI_PATH" ]]; then
            cp "$SIGNED_XPI_PATH" "Hatsune.signed.xpi"
            ASSETS+=("Hatsune.signed.xpi")
          else
            SIGNED_FALLBACK=$(find web-ext-artifacts -maxdepth 1 -name "*.xpi" ! -name "$(basename "$XPI_PATH")" 2>/dev/null | head -n 1 || true)
            if [[ -n "$SIGNED_FALLBACK" && -f "$SIGNED_FALLBACK" ]]; then
              cp "$SIGNED_FALLBACK" "Hatsune.signed.xpi"
              ASSETS+=("Hatsune.signed.xpi")
            fi
          fi
          
          gh release create "$GITHUB_REF_NAME" \
            "${ASSETS[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
