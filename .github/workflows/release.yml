name: Release & Publish Extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        uses: kewisch/action-web-ext@v1
        with:
          cmd: lint
          source: src
          channel: listed

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch version in manifest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src/manifest.json > tmp.json
          mv tmp.json src/manifest.json

      - name: Build
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: src
          filename: "{name}-{version}.xpi"

      - name: Sign & publish to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          echo '{ "version": { "license": "GPL-3.0-only" } }' > amo-metadata.json
          npx web-ext sign \
            --source-dir src \
            --api-key $AMO_JWT_ISSUER \
            --api-secret $AMO_JWT_SECRET \
            --channel listed \
            --amo-metadata amo-metadata.json

      - name: Create GitHub Release and attach xpi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.web-ext-build.outputs.target }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
