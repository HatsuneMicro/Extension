name: Release & Publish Extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint
        uses: kewisch/action-web-ext@v1
        with:
          cmd: lint
          source: src
          channel: listed

  release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Patch version in manifest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src/manifest.json > tmp.json
          mv tmp.json src/manifest.json

      - name: Build
        id: web-ext-build
        uses: kewisch/action-web-ext@v1
        with:
          cmd: build
          source: src
          filename: "{name}-{version}.xpi"

      - name: Sign & publish to AMO
        id: web-ext-sign
        uses: kewisch/action-web-ext@v1
        continue-on-error: true
        with:
          cmd: sign
          source: ${{ steps.web-ext-build.outputs.target }}
          channel: listed
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          metaDataFile: amo-metadata.json

      - name: Create GitHub Release and attach xpi
        env:
          GH_TOKEN: ${{ github.token }}
          XPI_PATH: ${{ steps.web-ext-build.outputs.target }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$XPI_PATH" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
